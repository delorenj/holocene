services:
  holocene-web:
    image: node:22
    container_name: holocene-web
    working_dir: /app
    command: >
      sh -c "corepack enable
      && if [ ! -x apps/web/node_modules/.bin/next ]; then pnpm install --frozen-lockfile --prod=false; fi
      && rm -rf apps/web/.next
      && NODE_ENV=production pnpm --filter @holocene/web build
      && NODE_ENV=production pnpm --filter @holocene/web start"
    env_file:
      - .env.holocene-web
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - HOLOCENE_API_INTERNAL_URL=${HOLOCENE_API_INTERNAL_URL:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      - holocene_node_modules:/app/node_modules
      - holocene_web_node_modules:/app/apps/web/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.holocene-web.entrypoints=websecure"
      - "traefik.http.routers.holocene-web.rule=Host(`holocene.delo.sh`)"
      - "traefik.http.routers.holocene-web.priority=300"
      - "traefik.http.routers.holocene-web.middlewares=google-auth@file"
      - "traefik.http.services.holocene-web.loadbalancer.server.port=${HOLOCENE_WEB_PORT:-3001}"
      - "traefik.http.routers.holocene-web.service=holocene-web"
      - "traefik.http.routers.holocene-web.tls=true"
      - "traefik.http.routers.holocene-web.tls.certresolver=letsencrypt"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: proxy

volumes:
  holocene_node_modules:
  holocene_web_node_modules:
