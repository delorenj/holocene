name: ticket-lifecycle
description: "Momo client protocol for authoritative project lifecycle"
version: "3.0.0"
status: client_protocol_implemented
execution_enabled: true

authority:
  lifecycle: "sole writer of versioned spec/state and sole calculator of reconcile, frontier, obligations, and capability validity"
  bloodbank: "canonical schemas/contracts and NATS/Dapr transport"
  candystore: "durable event history and rebuildable read models"
  pjangler: "project/bootstrap identity and binding inputs"
  momo: "business policy, legal-work selection, delegation, review, observations, evidence, and intent"
  holocene: "renderer and high-level command client"

required_snapshot_fields:
  - lifecycle_id
  - project_id
  - spec_version
  - state_version
  - provenance
  - observed_at
  - legal_frontier
  - obligations
  - blockers
  - capability_grants

required_command_fields:
  - command_id
  - idempotency_key
  - lifecycle_id
  - expected_state_version
  - actor
  - capability
  - intent

modes:
  create: steps-c/step-01-init.md
  edit: steps-e/step-01-assess.md
  validate: steps-v/step-01-validate.md
