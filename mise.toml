[env]
_.file = ".env"
_.path = [".mise/scripts", "agents/hermes/pm", "agents/hermes/pm/hermes"]

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/materialize-env.sh'"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link:agentfiles"

[tasks."link:agentfiles"]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"


[tasks."deploy"]
description = "Build and redeploy everything: API (systemd holocene-api) then web (holocene-web container)"
run = "'{{config_root}}/.mise/scripts/deploy.sh' all"

[tasks."deploy:api"]
description = "Build @holocene/api, restart holocene-api.service, wait for /health"
run = "'{{config_root}}/.mise/scripts/deploy.sh' api"

[tasks."deploy:web"]
description = "Restart holocene-web (it rebuilds on start) and wait for its healthcheck"
run = "'{{config_root}}/.mise/scripts/deploy.sh' web"

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "{{config_root}}/.mise/scripts/versioning.sh current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "{{config_root}}/.mise/scripts/versioning.sh bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "{{config_root}}/.mise/scripts/versioning.sh bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "{{config_root}}/.mise/scripts/versioning.sh bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "{{config_root}}/.mise/scripts/versioning.sh check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "{{config_root}}/.mise/scripts/versioning.sh sync"
# <<< mise-versioning <<<

[tasks."auto:check"]
description = "Test Android tooling, lint and build the isolated AAOS fixture experiment"
dir = "{{config_root}}/apps/auto"
run = ["/usr/bin/python3 -B -m unittest discover -s tools/tests -v", "./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain"]

[tasks."auto:release-bundle"]
description = "Resolve vault signing and build the signed Android Automotive OS AAB"
dir = "{{config_root}}/apps/auto"
run = "tools/build_release_bundle.sh"

[tasks."auto:tool-tests"]
description = "Test image recovery, SDK license parsing and Gradle integrity without modifying the host SDK"
dir = "{{config_root}}/apps/auto"
run = "/usr/bin/python3 -B -m unittest discover -s tools/tests -v"

[tasks."auto:tasks"]
description = "List the Android Gradle tasks"
dir = "{{config_root}}/apps/auto"
run = "./gradlew tasks --all"

[tasks."auto:install-honda"]
description = "Verify and install the official Honda feed/archive with explicit license acceptance"
run = "/usr/bin/python3 '{{config_root}}/apps/auto/tools/install_honda_image.py' ${@}"

[tasks."auto:probe"]
description = "Run emulator-only parked UI/microphone probes into an existing ignored evidence directory"
run = "/usr/bin/python3 '{{config_root}}/apps/auto/tools/emulator_probe.py' ${@}"

[tasks."auto:sim"]
description = "Start the Honda head-unit simulator (emulator-5554) as a desktop window; --headless for unattended"
run = "'{{config_root}}/apps/auto/tools/sim_start.sh' ${@}"

[tasks."auto:sim:stop"]
description = "Stop the simulator (saves the quick-boot snapshot)"
run = "'{{config_root}}/apps/auto/tools/sim_stop.sh'"

[tasks."auto:dev"]
description = "Build the debug APK, install on the simulator, restart the app (--logs, --grant-mic)"
run = "'{{config_root}}/apps/auto/tools/app_dev.sh' ${@}"

[tasks."pad:dev"]
description = "Agent Pad hot reload on the simulator: Vite HMR + adb reverse + debug app pointed at localhost"
run = "'{{config_root}}/apps/auto/tools/pad_dev.sh'"

[tasks."pad:build"]
description = "Build Agent Pad; nginx serves apps/agent-pad/dist so this deploys production"
run = "'{{config_root}}/apps/auto/tools/pad_build.sh'"

# --- Voice memo pipeline (services/inbox-watcher) ---------------------------
[tasks."memo:trace"]
description = "One timeline for a voice memo, hop by hop: memo:trace [<memo_id>|<s3 key>|<file>|latest] [--logs]"
run = "/usr/bin/python3 -B '{{config_root}}/services/inbox-watcher/memo_trace.py' trace"

[tasks."memo:retry"]
description = "Revive a failed or skipped voice memo at the stage it died in: memo:retry <memo_id|key>"
run = "/usr/bin/python3 -B '{{config_root}}/services/inbox-watcher/memo_trace.py' retry"

[tasks."memo:list"]
description = "Last N voice memos with the furthest stage each reached: memo:list [-n 15]"
run = "/usr/bin/python3 -B '{{config_root}}/services/inbox-watcher/memo_trace.py' list"

[tasks."memo:watcher:install"]
description = "Install, enable and start holocene-inbox-watcher.service (systemd user unit)"
run = "'{{config_root}}/services/inbox-watcher/install.sh' --restart"

[tasks."memo:watcher:logs"]
description = "Follow the voice memo watcher's structured JSON log"
run = "journalctl --user -u holocene-inbox-watcher.service -f -o cat"

[tasks."memo:test"]
description = "Run the voice memo pipeline tests (state machine with all external hops faked, upload fact contract)"
dir = "{{config_root}}/services"
run = "/usr/bin/python3 -B -m unittest discover -s inbox-watcher -p 'test_*.py' && /usr/bin/python3 -B -m unittest discover -s upload-proxy -p 'test_*.py'"
