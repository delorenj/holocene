# Include INSIDE the existing agent-pad nginx server block. Do not replace its
# /upload, /roster, avatar, or SPA locations. This is an exact, read-only route.
# This systemd API listens on the Docker proxy network's host gateway. Check
# the gateway with `docker inspect agent-pad-web` before installing this snippet;
# unlike the public Holocene hostname, this route does not pass through OIDC.
location = /api/modules/hub/agents {
    limit_except GET { deny all; }
    proxy_pass http://172.19.0.1:4000/api/modules/hub/agents;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_intercept_errors off;
}
